name: Publish Python SDK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested distributions to PyPI
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-python
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - run: python -m pip install build==1.5.0 twine==7.0.0
      - run: python -m unittest discover -s clients/python/tests -v
        env: {PYTHONPATH: clients/python}
      - run: python -m build --outdir dist clients/python
      - run: python tools/check-python-distributions.py dist
      - run: python -m twine check --strict dist/*
      - name: Check installed wheel in isolation
        run: |
          python -m venv /tmp/trace-consumer
          /tmp/trace-consumer/bin/pip install --no-deps dist/*.whl
          cp clients/python/tests/test_client.py /tmp/test_trace_client.py
          cd /tmp
          /tmp/trace-consumer/bin/python -m unittest test_trace_client -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: python-distributions, path: dist}
      - name: Publish tested distributions with OIDC and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
